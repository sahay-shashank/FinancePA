version: 3

silent: true

vars:
  GO_DIRS: ["Core"]

tasks:
  test:
    desc: Run tests
    summary: |
      Run Go tests for each top-level Core package directory
    cmds:
      - for:
          var: GO_DIRS
        cmd: |
          set -eou pipefail

          cd {{.ITEM}}
          go mod tidy

          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            [ "$dir" = "reports" ] && continue

            echo "[INFO] Testing ./$dir/..."
            go test "./$dir/..." -v
            awk -v n="${COLUMNS:-80}" 'BEGIN{for(i=0;i<n;i++) printf "-"; print ""}'
          done < <(find . -mindepth 1 -maxdepth 1 -type d ! -name '.*' | sed 's#^./##' | sort)

  coverage:
    desc: Test coverage report
    summary: |
      Generate detailed Go test coverage reports for each top-level Core folder
    cmds:
      - for:
          var: GO_DIRS
        cmd: |
          set -eou pipefail

          cd {{.ITEM}}
          t=$(date +"%Y-%m-%d-%T")
          mkdir -p reports
          go mod tidy

          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            [ "$dir" = "reports" ] && continue

            case "$dir" in
              features)
                pkgs="./features/..."
                coverpkg="./features/..."
                ;;
              utils)
                pkgs="./utils/..."
                coverpkg="./utils/..."
                ;;
              *)
                continue
                ;;
            esac

            mkdir -p "reports/$dir"
            echo "[INFO] Generating coverage report for $dir"
            go test $pkgs -coverpkg="$coverpkg" -coverprofile="./reports/$dir/coverage_${t}.out"
            go tool cover -func="./reports/$dir/coverage_${t}.out" > "./reports/$dir/coverage_${t}.txt"
          done < <(find . -mindepth 1 -maxdepth 1 -type d ! -name '.*' | sed 's#^./##' | sort)

